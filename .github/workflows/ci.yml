name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # ffmpeg нужен уже юнит-тестам ingest/worker (тестовые медиа генерируются
      # ffmpeg'ом), а не только e2e: раньше он ставился после unit-тестов,
      # и на раннере без ffmpeg CI падал на ingest.
      - name: ffmpeg (unit-тесты ingest и e2e-харнесс)
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -version | head -1

      - name: Unit tests (PGlite, без Docker)
        run: pnpm test

      - name: Playwright browsers
        run: pnpm --filter @zal/web exec playwright install --with-deps chromium

      - name: Build web (e2e-инлайн API URL)
        run: pnpm --filter @zal/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Web e2e (chromium, реальный ffmpeg-ингест)
        # github-репортер выводит упавшие тесты аннотациями прямо в PR.
        run: pnpm --filter @zal/web exec playwright test --project=chromium --grep-invert @visual --reporter=github,line

      # Визуальные регрессии отдельным шагом: падение вёрстки не путается
      # с падением плеера. Нет эталона — он снимается здесь же (на раннере,
      # где и сравнивается) и уходит артефактом visual-snapshots для коммита.
      - name: Web visual regression (chromium)
        id: visual
        run: |
          # Эталонов нет — снимаем (тест не падает); есть — строгое сравнение.
          if ls apps/web/e2e/visual.spec.ts-snapshots/*.png >/dev/null 2>&1; then update=none; else update=all; fi
          pnpm --filter @zal/web exec playwright test e2e/visual.spec.ts --project=chromium --update-snapshots=$update --reporter=github,line

      - name: Новые эталоны снапшотов
        if: always() && steps.visual.outcome != 'skipped'
        run: |
          new=$(git status --porcelain --untracked-files=all apps/web/e2e/visual.spec.ts-snapshots | wc -l)
          echo "new_snapshots=$new" >> "$GITHUB_ENV"
          if [ "$new" -gt 0 ]; then
            echo "::warning title=visual::Сняты новые эталоны ($new): скачайте артефакт visual-snapshots и закоммитьте в apps/web/e2e/visual.spec.ts-snapshots/"
          fi

      - name: Артефакт эталонов снапшотов
        if: always() && env.new_snapshots != '0' && env.new_snapshots != ''
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: apps/web/e2e/visual.spec.ts-snapshots
          retention-days: 14

      # Хвост лога e2e-харнесса (API+ингест) — аннотацией: без него падение
      # на старте webServer видно только как «exit code 1».
      - name: Лог e2e-харнесса при падении
        if: failure()
        run: |
          [ -f /tmp/zal-e2e-server.log ] || { echo "::error title=e2e-server::лог не создан"; exit 0; }
          msg=$(tail -60 /tmp/zal-e2e-server.log | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=e2e-server log::$msg"

      - name: Mobile e2e (expo web, chromium)
        run: pnpm --filter @zal/mobile exec playwright test --project=chromium

      - name: Артефакты упавших прогонов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/mobile/test-results
          retention-days: 7

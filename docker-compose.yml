# Порты публикуются ТОЛЬКО на loopback: Docker пишет свои правила в nat
# PREROUTING и filter DOCKER, поэтому опубликованный на 0.0.0.0 порт обходит
# ufw целиком (цепочка INPUT не участвует). Снаружи Postgres с паролем
# zal:zal пускал кого угодно — проверено 29.09.2026.
# Хост-клиенты (API, db:setup, deploy.sh) ходят через localhost и не ломаются.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zal
      POSTGRES_PASSWORD: zal
      POSTGRES_DB: zal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zal -d zal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zal
      MINIO_ROOT_PASSWORD: zalzalzal
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 zal zalzalzal;
      mc mb --ignore-existing local/zal-media;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
